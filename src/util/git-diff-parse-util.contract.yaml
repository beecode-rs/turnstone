subject: gitDiffParseUtil
module: ./git-diff-parse-util.ts
subjectType: function
methods:
  parseNumstatOutput:
    terms:
      - params:
          - output: "1\t0\ta.ts\0"
        result:
          - added: 1
            deleted: 0
            origPath: null
            path: a.ts
      - params:
          - output: "-\t-\tlogo.png\0"
        result:
          - added: null
            deleted: null
            origPath: null
            path: logo.png
      - params:
          - output: "0\t0\t\0old-name.ts\0new-name.ts\0"
        result:
          - added: 0
            deleted: 0
            origPath: old-name.ts
            path: new-name.ts
      - params:
          - output: "1\t0\tplain.txt\0-\t-\tlogo.png\00\t0\t\0old-name.ts\0new-name.ts\0"
        result:
          - added: 1
            deleted: 0
            origPath: null
            path: plain.txt
          - added: null
            deleted: null
            origPath: null
            path: logo.png
          - added: 0
            deleted: 0
            origPath: old-name.ts
            path: new-name.ts
      - params:
          - output: "1\t0\tplain.txt\00\t0\t\0r1-old.txt\0r1-new.txt\00\t0\t\0r2-old.txt\0r2-new.txt\0"
        result:
          - added: 1
            deleted: 0
            origPath: null
            path: plain.txt
          - added: 0
            deleted: 0
            origPath: r1-old.txt
            path: r1-new.txt
          - added: 0
            deleted: 0
            origPath: r2-old.txt
            path: r2-new.txt
      - params:
          - output: ''
        result: []
      - params:
          - output: "3\t1\tsrc/a.ts"
        result:
          - added: 3
            deleted: 1
            origPath: null
            path: src/a.ts
  parseUnifiedDiff:
    terms:
      - params:
          - diffText: "diff --git a/src/app.ts b/src/app.ts\nindex 1234567..89abcde 100644\n--- a/src/app.ts\n+++ b/src/app.ts\n@@ -1,3 +1,4 @@\n const x = 1;\n-old = 2;\n+new = 2;\n+new = 3;\n return x;"
        result:
          - additions: 2
            deletions: 1
            from: src/app.ts
            hunks:
              - changes:
                  - content: ' const x = 1;'
                    newLineNumber: 1
                    oldLineNumber: 1
                    type: normal
                  - content: '-old = 2;'
                    newLineNumber: null
                    oldLineNumber: 2
                    type: del
                  - content: '+new = 2;'
                    newLineNumber: 2
                    oldLineNumber: null
                    type: add
                  - content: '+new = 3;'
                    newLineNumber: 3
                    oldLineNumber: null
                    type: add
                  - content: ' return x;'
                    newLineNumber: 4
                    oldLineNumber: 3
                    type: normal
                content: '@@ -1,3 +1,4 @@'
                newLines: 4
                newStart: 1
                oldLines: 3
                oldStart: 1
            to: src/app.ts
      - params:
          - diffText: "diff --git a/new.txt b/new.txt\nnew file mode 100644\nindex 0000000..abc1234\n--- /dev/null\n+++ b/new.txt\n@@ -0,0 +1,2 @@\n+one\n+two"
        result:
          - additions: 2
            deletions: 0
            from: /dev/null
            hunks:
              - changes:
                  - content: '+one'
                    newLineNumber: 1
                    oldLineNumber: null
                    type: add
                  - content: '+two'
                    newLineNumber: 2
                    oldLineNumber: null
                    type: add
                content: '@@ -0,0 +1,2 @@'
                newLines: 2
                newStart: 1
                oldLines: 0
                oldStart: 0
            to: new.txt
      - params:
          - diffText: ''
        result: []
  computeWordDiff:
    terms:
      - params:
          - newLine: const count = 2;
            oldLine: const count = 1;
        result:
          - isAdded: false
            isRemoved: false
            value: 'const count = '
          - isAdded: false
            isRemoved: true
            value: '1'
          - isAdded: true
            isRemoved: false
            value: '2'
          - isAdded: false
            isRemoved: false
            value: ';'
      - params:
          - newLine: same line
            oldLine: same line
        result:
          - isAdded: false
            isRemoved: false
            value: same line
      - params:
          - newLine: added line
            oldLine: ''
        result:
          - isAdded: true
            isRemoved: false
            value: added line
  toAddedPatch:
    terms:
      # Many: multi-line content becomes a single all-additions hunk numbered from 1
      - params:
          - content: "const port = 8080;\nexport default port;\n"
            path: src/server/config.ts
        result:
          additions: 2
          deletions: 0
          from: null
          hunks:
            - changes:
                - content: "const port = 8080;\n"
                  newLineNumber: 1
                  oldLineNumber: null
                  type: add
                - content: "export default port;\n"
                  newLineNumber: 2
                  oldLineNumber: null
                  type: add
              content: '@@ -0,0 +1,2 @@'
              newLines: 2
              newStart: 1
              oldLines: 0
              oldStart: 0
          isEmptyFile: false
          isTruncated: false
          to: src/server/config.ts
      # One: single-line content
      - params:
          - content: "node_modules/\n"
            path: .gitignore
        result:
          additions: 1
          deletions: 0
          from: null
          hunks:
            - changes:
                - content: "node_modules/\n"
                  newLineNumber: 1
                  oldLineNumber: null
                  type: add
              content: '@@ -0,0 +1,1 @@'
              newLines: 1
              newStart: 1
              oldLines: 0
              oldStart: 0
          isEmptyFile: false
          isTruncated: false
          to: .gitignore
      # Zero: empty content yields a patch with no hunks
      - params:
          - content: ''
            path: notes/empty.md
        result:
          additions: 0
          deletions: 0
          from: null
          hunks: []
          isEmptyFile: true
          isTruncated: false
          to: notes/empty.md
      # Oops: missing trailing newline still produces newline-terminated change content
      - params:
          - content: "const port = 8080;\nexport default port;"
            path: src/server/config.ts
        result:
          additions: 2
          deletions: 0
          from: null
          hunks:
            - changes:
                - content: "const port = 8080;\n"
                  newLineNumber: 1
                  oldLineNumber: null
                  type: add
                - content: "export default port;\n"
                  newLineNumber: 2
                  oldLineNumber: null
                  type: add
              content: '@@ -0,0 +1,2 @@'
              newLines: 2
              newStart: 1
              oldLines: 0
              oldStart: 0
          isEmptyFile: false
          isTruncated: false
          to: src/server/config.ts
