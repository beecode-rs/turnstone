                newLineNumber: 4
                oldLineNumber: null
                type: add
              - content: "process.on('exit', () => {});"
                newLineNumber: 5
                oldLineNumber: null
                type: add
        result:
          - left:
              content: 'import { createServer } from node:http;'
              newLineNumber: 1
