          - left:
              content: 'import os from node:os;'
              newLineNumber: null
              oldLineNumber: 3
              type: del
            right: null
      # Adds emitted before dels: first del still pairs with first add, leftover add alone on the right
      - params:
          - changes:
              - content: 'const retries = 3;'
                newLineNumber: 1
                oldLineNumber: null
                type: add
              - content: 'const port = 8080;'
                newLineNumber: 2
                oldLineNumber: null
                type: add
              - content: 'const port = 3000;'
                newLineNumber: null
                oldLineNumber: 1
                type: del
        result:
          - left:
              content: 'const port = 3000;'
              newLineNumber: null
              oldLineNumber: 1
              type: del
            right:
              content: 'const retries = 3;'
              newLineNumber: 1
              oldLineNumber: null
              type: add
          - left: null
